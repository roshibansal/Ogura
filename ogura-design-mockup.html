<title>Ogura Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --rose:#D6285F; --rose-d:#AE1E4C; --green:#0C7A54; --sale:#B03A57;
  --paper:#FDFCFA; --wash:#F6F2ED; --stone:#EAE5DE;
  --ink:#1B1714; --grey:#6F6862; --grey-2:#9A938C; --line:#E3DED8; --pad:32px;
}
@media(max-width:820px){:root{--pad:16px}}
*{box-sizing:border-box}
body{margin:0;background:#DCD6CE;color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
img{display:block}
.shell{max-width:1320px;margin:0 auto;padding:18px 12px 50px}
.tabs{display:flex;gap:3px;justify-content:center;width:max-content;margin:0 auto 12px;background:rgba(255,255,255,.85);padding:4px}
.tabs button{border:0;background:transparent;font:700 .68rem/1 "Inter Tight";letter-spacing:.1em;
  text-transform:uppercase;padding:9px 18px;cursor:pointer;color:var(--grey)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.browser{background:var(--paper);overflow:hidden;box-shadow:0 28px 60px -26px rgba(50,38,25,.42)}
.bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:#EDE9E3;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:#D2CBC2}
.url{flex:1;background:#fff;padding:4px 13px;font-size:.68rem;color:var(--grey-2);text-align:center}
.screen{display:none}.screen.on{display:block}

/* ---------- promo strip ---------- */
.promo{background:var(--wash);color:var(--grey);border-bottom:1px solid var(--line);display:flex;justify-content:center;
  gap:44px;padding:10px 12px;font-size:.72rem;font-weight:400;letter-spacing:.02em;overflow:hidden;white-space:nowrap}
.promo span:nth-child(n+3){display:none}
@media(min-width:760px){.promo span:nth-child(n+3){display:inline}}

/* ---------- header ---------- */
header.hd{display:flex;align-items:center;gap:18px;padding:14px var(--pad);background:var(--paper);position:sticky;top:0;z-index:30}
.wm{font:600 1.5rem/1 "Inter Tight";letter-spacing:-.04em;color:var(--rose);flex-shrink:0}
.search{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:2px;padding:11px 16px;font-size:.86rem;color:var(--grey-2)}
.search b{margin-left:auto;font-size:.74rem;font-weight:500;color:var(--ink)}
.util{display:flex;gap:20px;font-size:.8rem;font-weight:500;color:var(--grey);flex-shrink:0}
.util .bg{color:var(--rose)}
@media(max-width:700px){.util span:not(.bg){display:none}}
nav.mainnav{display:flex;gap:0;padding:0 var(--pad);background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:57px;z-index:29}
nav.mainnav a{flex-shrink:0;padding:14px 16px 13px;font-size:.82rem;font-weight:500;letter-spacing:.01em;
  color:var(--grey);text-decoration:none;cursor:pointer;border-bottom:2px solid transparent}
nav.mainnav a:hover{color:var(--ink)}
nav.mainnav a:first-child{padding-left:0}
nav.mainnav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--rose)}
nav.mainnav a.sale{color:var(--sale)}

/* ---------- hero banner ---------- */
.banner{position:relative;min-height:430px;overflow:hidden;background:var(--stone)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.banner .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,9,8,.62) 0%,rgba(12,9,8,.22) 50%,rgba(12,9,8,0) 80%)}
.shopthis{position:absolute;right:24px;bottom:24px;background:rgba(255,255,255,.97);border-radius:3px;
  padding:12px 15px;min-width:200px;box-shadow:0 12px 34px -14px rgba(30,20,12,.6)}
.shopthis .a{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-2)}
.shopthis .n{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.16rem;margin:5px 0 0;line-height:1.1}
.shopthis .p{font-size:.84rem;font-weight:600;margin:4px 0 0}
.shopthis .g{font-size:.72rem;color:var(--rose);margin:7px 0 0}
@media(max-width:700px){.shopthis{display:none}}
.city{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.1em;
  transition:opacity .5s ease, transform .5s cubic-bezier(.16,.8,.28,1);display:inline-block}
.city.out{opacity:0;transform:translateY(-8px)}
.banner .tx{position:relative;padding:66px var(--pad);max-width:640px;color:#fff}
.banner .eyebrow{font-size:.68rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.banner h1{margin:16px 0 0;font-size:clamp(2rem,4.6vw,3.3rem);font-weight:500;letter-spacing:-.028em;line-height:1.06}
.banner p{margin:16px 0 0;font-size:.98rem;line-height:1.6;opacity:.92;max-width:44ch}
.banner .bs{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.bt{padding:13px 26px;font-size:.82rem;font-weight:500;letter-spacing:.01em;cursor:pointer;border-radius:2px}
.bt.w{background:#fff;color:var(--ink)}
.bt.o{border:1.5px solid #fff;color:#fff}

/* ---------- three promo tiles ---------- */
.promos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px var(--pad) 0}
@media(max-width:820px){.promos{grid-template-columns:1fr}}
.pt{position:relative;aspect-ratio:16/7;overflow:hidden;background:var(--stone);cursor:pointer}
.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,.8,.28,1)}
.pt:hover img{transform:scale(1.05)}
.pt .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,9,8,.68),rgba(12,9,8,.12))}
.pt .t{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:#fff}
.pt .t b{display:block;font-size:1.16rem;font-weight:500;letter-spacing:-.018em}
.pt .t span{display:inline-block;margin-top:8px;font-size:.76rem;font-weight:400;opacity:.9;
  border-bottom:1px solid rgba(255,255,255,.7);padding-bottom:2px}

/* ---------- section ---------- */
.sec{padding:46px var(--pad) 0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.sh h2{margin:0;font-size:1.4rem;font-weight:500;letter-spacing:-.022em}
.sh a{font-size:.8rem;font-weight:500;color:var(--grey);border-bottom:1px solid var(--line);
  padding-bottom:2px;cursor:pointer;white-space:nowrap}

/* ---------- category blocks ---------- */
.cblocks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.cblocks{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.cblocks{grid-template-columns:repeat(2,1fr)}}
.cb{position:relative;aspect-ratio:4/5;overflow:hidden;cursor:pointer;background:var(--stone)}
.cb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,.8,.28,1)}
.cb:hover img{transform:scale(1.06)}
.cb .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,7,.8) 0%,rgba(10,8,7,.1) 52%,transparent 74%)}
.cb .l{position:absolute;left:0;right:0;bottom:0;padding:14px 13px;color:#fff}
.cb .l b{display:block;font-size:1.02rem;font-weight:500;letter-spacing:-.012em;line-height:1.15}
.cb .l span{font-size:.68rem;opacity:.82}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.pc{position:relative;cursor:pointer}
.pw{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--stone)}
.pw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .9s cubic-bezier(.16,.8,.28,1),opacity .4s ease}
.pw img.alt{opacity:0}
.pc:hover .pw img.main{opacity:0}
.pc:hover .pw img.alt{opacity:1;transform:scale(1.04)}
.save{position:absolute;top:9px;left:9px;background:rgba(255,255,255,.95);color:var(--sale);font-size:.66rem;
  font-weight:600;letter-spacing:.02em;padding:4px 9px;border-radius:2px}
.stk{position:absolute;bottom:9px;left:9px;background:rgba(255,255,255,.95);color:var(--green);font-size:.65rem;
  font-weight:500;letter-spacing:.01em;padding:4px 9px;border-radius:2px}
.stk.mo{color:var(--grey)}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink);border-radius:50%}
.quick{position:absolute;left:9px;right:9px;bottom:9px;background:rgba(255,255,255,.97);color:var(--ink);
  display:flex;justify-content:center;gap:12px;padding:10px 0;font-size:.74rem;font-weight:500;border-radius:2px;
  box-shadow:0 4px 14px rgba(40,25,15,.16);opacity:0;transform:translateY(6px);transition:.2s}
.quick b{font-weight:500;color:var(--grey-2)}
.pc:hover .quick{opacity:1;transform:none}
.pb{padding:10px 2px 0}
.pb .at{font-size:.68rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--grey-2)}
.pb .pn{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.1rem;line-height:1.15;margin:5px 0 0}
.pb .ds{font-size:.74rem;color:var(--grey);margin:3px 0 0}
.pb .pp{margin:7px 0 0;font-size:.88rem;font-weight:600;display:flex;gap:8px;align-items:baseline}
.pb .pp .mrp{font-weight:400;color:var(--grey-2);text-decoration:line-through;font-size:.76rem}
.pb .pp .off{color:var(--sale);font-size:.74rem;font-weight:500}
.pb .rt{margin:6px 0 0;font-size:.72rem;color:var(--grey);letter-spacing:.01em}
.pb .rt .star{color:var(--rose)}
.pb .rt span{color:var(--grey-2)}
.pb .talk{margin:9px 0 0;font-size:.74rem;font-weight:500;color:var(--ink);
  border-bottom:1px solid var(--line);display:inline-block;padding-bottom:2px;transition:.2s}
.pc:hover .pb .talk{border-bottom-color:var(--rose);color:var(--rose)}
.sws{display:flex;gap:5px;margin-top:8px}
.sws i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}

/* ---------- listing with left rail ---------- */
.arail{display:flex;gap:16px;overflow-x:auto;padding:0 var(--pad) 8px;scrollbar-width:none}
.arail::-webkit-scrollbar{display:none}
.ac{flex:0 0 196px;cursor:pointer}
.ac .f{aspect-ratio:5/4;overflow:hidden;background:var(--stone)}
.ac .f img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,.8,.28,1)}
.ac:hover .f img{transform:scale(1.05)}
.ac .n{font-size:.94rem;font-weight:600;margin:11px 0 0;letter-spacing:-.012em}
.ac .c{font-size:.74rem;color:var(--grey);margin:3px 0 0}
.ac .r{font-size:.72rem;color:var(--grey);margin:5px 0 0}
.ac .r .star{color:var(--rose)}
.crumbs{padding:16px var(--pad) 0;font-size:.72rem;color:var(--grey-2)}
.lhead{padding:10px var(--pad) 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.lhead h1{margin:0;font-size:1.85rem;font-weight:500;letter-spacing:-.025em}
.lhead .ct{font-size:.8rem;color:var(--grey)}
.sortbar{display:flex;gap:10px;align-items:center;padding:0 var(--pad) 16px;flex-wrap:wrap}
.sel{border:1px solid var(--line);background:#fff;padding:9px 15px;font-size:.8rem;font-weight:500;
  border-radius:2px;cursor:pointer;color:var(--grey)}
.listing{display:grid;grid-template-columns:212px 1fr;gap:26px;padding:0 var(--pad)}
@media(max-width:900px){.listing{grid-template-columns:1fr}.rail{display:none}}
.rail .grp{border-bottom:1px solid var(--line);padding:16px 0}
.rail .grp h4{margin:0 0 11px;font-size:.72rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.rail label{display:flex;align-items:center;gap:9px;font-size:.8rem;color:var(--grey);padding:4px 0;cursor:pointer}
.rail label i{width:14px;height:14px;border:1.5px solid var(--line);flex-shrink:0;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#fff}
.rail label.on{color:var(--ink);font-weight:600}
.rail label.on i{background:var(--ink);border-color:var(--ink)}

/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;padding:24px var(--pad) 0}
@media(max-width:880px){.pdp{grid-template-columns:1fr;gap:24px}}
.gal{display:grid;grid-template-columns:76px 1fr;gap:10px}
@media(max-width:600px){.gal{grid-template-columns:1fr}}
.gal .th{display:flex;flex-direction:column;gap:8px}
.gal .th div{aspect-ratio:3/4;overflow:hidden;opacity:.5;cursor:pointer}
.gal .th div:first-child{opacity:1;outline:1.5px solid var(--ink)}
.gal .th img,.gal .main img{width:100%;height:100%;object-fit:cover}
.gal .main{aspect-ratio:3/4;overflow:hidden;background:var(--stone)}
.buy .at{font-size:.72rem;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--grey-2)}
.buy h1{margin:9px 0 0;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:2.3rem;line-height:1.06}
.buy .ds{margin:8px 0 0;color:var(--grey);font-size:.9rem}
.buy .price{margin:18px 0 0;font-size:1.4rem;font-weight:600;display:flex;gap:11px;align-items:baseline;letter-spacing:-.015em}
.buy .price .m{font-size:.92rem;font-weight:400;color:var(--grey-2);text-decoration:line-through}
.buy .price .o{font-size:.8rem;color:var(--sale);font-weight:700}
.opt{margin-top:24px}
.opt h4{margin:0 0 10px;font-size:.72rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips span{border:1px solid var(--line);padding:10px 15px;font-size:.8rem;color:var(--grey);cursor:pointer;font-weight:400;border-radius:2px;background:#fff}
.chips span.sel{border-color:var(--ink);color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1.5px var(--line)}
.sw.sel{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2.5px #fff}
.ctas{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.ctas .a{text-align:center;padding:16px;font-size:.86rem;font-weight:500;letter-spacing:.01em;cursor:pointer;border-radius:2px}
.ctas .primary{background:var(--ink);color:#fff}
.ctas .second{border:1.5px solid var(--ink)}
.atbox{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-top:22px}
.atbox .ph{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0}
.atbox .ph img{width:100%;height:100%;object-fit:cover}
.atbox .nn{flex:1;min-width:0}
.atbox .nn b{font-size:.92rem;font-weight:600;display:block}
.atbox .nn .vf{font-size:.66rem;font-weight:500;color:var(--green);border:1px solid var(--green);
  border-radius:2px;padding:1px 5px;margin-left:5px;vertical-align:2px}
.atbox .nn span{font-size:.74rem;color:var(--grey);display:block;margin-top:3px}
.atbox .star{color:var(--rose)}
.atbox .fw{border:1px solid var(--ink);border-radius:2px;padding:7px 15px;font-size:.78rem;font-weight:500;cursor:pointer;flex-shrink:0}
.pin{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;background:var(--wash);
  padding:12px 14px;font-size:.79rem;color:var(--grey)}
.pin b{color:var(--ink);font-weight:600}
.pin em{font-style:normal;color:var(--green);font-weight:500}
.pin .ch{margin-left:auto;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer}
.trust{margin-top:18px;background:var(--wash);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.trust div{font-size:.79rem;color:var(--grey);line-height:1.5;display:flex;gap:11px}
.trust b{color:var(--ink);font-weight:600}
.trust i{font-style:normal;color:var(--green);width:12px;flex-shrink:0}

footer.ft{margin-top:60px;background:var(--wash);border-top:1px solid var(--line);padding:40px var(--pad) 36px;
  display:flex;justify-content:space-between;gap:38px;flex-wrap:wrap}
footer.ft .wmf{font:600 1.25rem/1 "Inter Tight";letter-spacing:-.04em;color:var(--rose)}
footer.ft .blurb{margin-top:12px;max-width:25ch;font-size:.8rem;color:var(--grey);line-height:1.7}
footer.ft .cols{display:flex;gap:56px;flex-wrap:wrap}
footer.ft b{display:block;margin-bottom:12px;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--grey)}
footer.ft p{margin:0 0 8px;font-size:.81rem;color:var(--grey)}
.caption{max-width:1320px;margin:14px auto 0;padding:0 12px;font-size:.79rem;color:#6E6055;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="home">Home</button>
    <button role="tab" aria-selected="false" data-t="browse">Listing</button>
    <button role="tab" aria-selected="false" data-t="product">Product</button>
  </div>
  <div class="browser">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="url" id="url">ogura.in</span></div>
    <div id="home" class="screen on"></div>
    <div id="browse" class="screen"></div>
    <div id="product" class="screen"></div>
  </div>
  <p class="caption">Hover a product for quick view. Listing tab has the full filter rail.</p>
</div>
